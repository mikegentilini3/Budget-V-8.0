<title>Private Budget</title>
<style>
:root{--bg:#f2f4f5;--card:#fff;--text:#1b2428;--muted:#5f6c72;--accent:#1e7d6e;--accent-t:#fff;--bad:#c0392b;--good:#1e7d3a;--warn:#b26a00;--line:#dfe4e6}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}
#view{padding:14px 14px calc(88px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto;padding-top:calc(14px + env(safe-area-inset-top))}
h1{font-size:24px;margin:4px 0 12px}h2{font-size:18px;margin:18px 0 8px}h3{font-size:15px;margin:12px 0 6px;color:var(--muted);font-weight:600}
.card{background:var(--card);border-radius:12px;padding:12px 14px;margin:0 0 12px;border:1px solid var(--line)}
.big{font-size:30px;font-weight:700;letter-spacing:-.5px}.muted{color:var(--muted);font-size:14px}.neg{color:var(--bad)}.pos{color:var(--good)}.warn{color:var(--warn)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
#tabs button{flex:1;border:0;background:none;color:var(--muted);font-size:11px;padding:10px 0 9px;min-height:50px}
#tabs button.on{color:var(--accent);font-weight:700}
.btn{display:block;width:100%;border:0;border-radius:10px;background:var(--accent);color:var(--accent-t);font-size:17px;font-weight:600;padding:13px;min-height:48px;margin:6px 0}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.small{display:inline-block;width:auto;font-size:14px;padding:8px 12px;min-height:38px;margin:4px 6px 4px 0}
.btn:disabled{opacity:.5}
.link{background:none;border:0;color:var(--accent);font-size:15px;padding:8px 0;min-height:40px}
.row{display:flex;gap:10px}.row>*{flex:1}
label{display:block;font-size:14px;color:var(--muted);margin:10px 0 0}
input,select{display:block;width:100%;font-size:16px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--text);margin-top:4px;min-height:46px}
input[type=checkbox]{display:inline-block;width:22px;min-height:22px;height:22px;margin:0 8px 0 0;vertical-align:middle}
.seg{display:flex;border:1px solid var(--accent);border-radius:10px;overflow:hidden;margin:4px 0 8px}
.seg button{flex:1;border:0;background:none;color:var(--accent);font-size:15px;padding:10px 0;min-height:42px}

table{width:100%;border-collapse:collapse}td,th{padding:9px 4px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
th{font-size:13px;color:var(--muted);font-weight:600}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{font-weight:700;border-bottom:0}
.tx{display:flex;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.tx:last-child{border-bottom:0}.tx .l{min-width:0}.tx .t{font-weight:600;overflow-wrap:break-word}.tx .r{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}

<body>
<main id="view"><div class="card" style="margin-top:40px"><b>Opening your budget…</b><div class="muted">If this takes more than a few seconds, wait: it retries automatically.</div></div></main>
<nav id="tabs"></nav>
<div id="modal"></div><div id="dialog"></div><div id="toast"></div>
<script>
(function(){
'use strict';

/* =====================================================================
   PRIVATE BUDGET — everything runs on this device. There is no network
   code in this file (and the Content-Security-Policy above blocks it).
   Money is always whole cents (integers). Percentages are stored as
   "basis points": 25% = 2500, 33.33% = 3333, 100% = 10000.
   ===================================================================== */

/* ---------- money / date helpers ---------- */
var MAX_CENTS = 99999999999; // $999,999,999.99
function parseMoney(s){
  s = String(s==null?'':s).trim().replace(/^\$\s*/,'').replace(/,/g,'');
  if(!/^(\d+\.?\d*|\.\d+)$/.test(s)) return null;
  var p = s.split('.'), w = p[0]||'0', f = p[1]||'';
  if(f.length>2) return null;
  var c = parseInt(w,10)*100 + parseInt((f+'00').slice(0,2),10);
  return (Number.isSafeInteger(c) && c<=MAX_CENTS) ? c : null;
}
function parseSignedMoney(s){
  s = String(s||'').trim(); var neg=false;
  if(s[0]==='-'){neg=true;s=s.slice(1).trim();} else if(s[0]==='+'){s=s.slice(1).trim();}
  var c=parseMoney(s); if(c===null) return null; return neg?-c:c;
}
function parsePct(s){
  s = String(s==null?'':s).trim().replace(/%$/,'').trim();
  if(s==='') return 0;
  if(!/^\d{1,3}(\.\d{1,2})?$/.test(s)) return null;
  var p=s.split('.'); var bp=parseInt(p[0],10)*100+parseInt(((p[1]||'')+'00').slice(0,2),10);
  return bp<=10000?bp:null;
}
function fmt(c){
  var neg=c<0; c=Math.abs(c);
  var d=Math.floor(c/100), r=c%100;
  return (neg?'-':'')+'$'+String(d).replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+String(r).padStart(2,'0');
}
function plain(c){ return Math.floor(c/100)+'.'+String(c%100).padStart(2,'0'); }
function pctStr(bp){ var s=(bp/100).toFixed(2); return s.replace(/\.?0+$/,''); }
function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function validDate(s){
  if(typeof s!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(s)) return false;
  var a=s.split('-').map(Number), dt=new Date(a[0],a[1]-1,a[2]);
  return a[0]>=1900&&a[0]<=2200&&dt.getFullYear()===a[0]&&dt.getMonth()===a[1]-1&&dt.getDate()===a[2];
}
function fmtDate(s){ var a=s.split('-').map(Number); return new Date(a[0],a[1]-1,a[2]).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}); }
function monthName(ym){ var a=ym.split('-').map(Number); return new Date(a[0],a[1]-1,1).toLocaleDateString(undefined,{year:'numeric',month:'long'}); }
/* Title Case: capitalizes each word; small words (of, the, and, to...) stay lowercase unless first or last.
   Words you typed with their own capitals (McDonald's, iPhone) are left alone. Short ALL-CAPS words (ATM, IRS) are kept as
   acronyms, unless the whole entry is ALL CAPS (typical of bank exports), which is converted normally. */
var MINORW={a:1,an:1,and:1,as:1,at:1,but:1,by:1,for:1,in:1,nor:1,of:1,on:1,or:1,per:1,the:1,to:1,via:1,vs:1};
function titleCase(str){
  str=String(str==null?'':str).replace(/\s+/g,' ').trim();
  if(!str) return str;
  var toks=str.split(' '), letters=str.replace(/[^A-Za-z]/g,'');
  var wholeUpper=letters.length>0&&letters===letters.toUpperCase()&&(toks.length>1||letters.length>3);
  return toks.map(function(tok,i){
    var core=tok.replace(/^[^A-Za-z0-9]+|[^A-Za-z0-9]+$/g,'');
    var low=core.toLowerCase();
    if(i>0&&i<toks.length-1&&MINORW[low]&&(wholeUpper||core===low||core===core.charAt(0).toUpperCase()+core.slice(1).toLowerCase()||core===core.toUpperCase())) return tok.replace(core,low);
    return tok.split('-').map(function(part){
      var m=/^([^A-Za-z0-9]*)([A-Za-z0-9].*)$/.exec(part); if(!m) return part;
      var lead=m[1], c=m[2];
      var allCaps=/[A-Z]/.test(c)&&c===c.toUpperCase();
      if(!allCaps&&/[A-Z]/.test(c.slice(1))) return part;
      if(allCaps&&!wholeUpper&&c.replace(/[^A-Za-z]/g,'').length<=3) return part;
      return lead+c.charAt(0).toUpperCase()+c.slice(1).toLowerCase();
    }).join('-');
  }).join(' ');
}
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uid(){
  try{ if(window.crypto&&crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)+Math.random().toString(36).slice(2,6);
}

/* ---------- allocation (documented rounding rule) ----------
   Each category's exact share = cents * bp / 10000.
   1. Everyone gets the whole-cent part (floor).
   2. The total to distribute is round-half-up(cents * totalBp / 10000).
      At exactly 100% that is the full income amount.
   3. Leftover cents (always fewer than the number of categories) go one each
      to the categories with the largest fractional remainder; ties go to the
      category listed first (lowest "order", i.e. created earliest).
   4. Whatever is not distributed (only when total < 100%) is "unallocated".
   Integer math only, so no cent is created or lost. */
function allocate(cents, rules){
  var totalBp=0, i;
  for(i=0;i<rules.length;i++) totalBp+=rules[i].bp;
  if(totalBp>10000) throw new Error('Allocation percentages total more than 100%.');
  var items=rules.map(function(r,idx){ var num=cents*r.bp; return {catId:r.catId,bp:r.bp,cents:Math.floor(num/10000),rem:num%10000,i:idx}; });
  var target=Math.floor((cents*totalBp+5000)/10000);
  var given=0; items.forEach(function(x){given+=x.cents;});
  var left=target-given;
  var order=items.filter(function(x){return x.bp>0;}).sort(function(a,b){return (b.rem-a.rem)||(a.i-b.i);});
  var k=0; while(left>0&&order.length){ order[k%order.length].cents+=1; left--; k++; }
  return {allocs:items.map(function(x){return {catId:x.catId,bp:x.bp,cents:x.cents};}), unallocated:cents-target};
}
/* One-time custom allocation: user supplies exact cents per category.
   Sum of provided amounts must not exceed the income total; remainder is unallocated.
   bp is stored as the share of the full income so history displays still make sense. */
function customAllocate(cents, items){
  var sum=0, allocs=[], seen={};
  (items||[]).forEach(function(it){
    if(!it||!it.catId) return;
    var c=it.cents;
    if(c===null||c===undefined||!Number.isSafeInteger(c)||c<0) fail('Custom allocation amounts must be whole cents ≥ 0.');
    if(c===0) return;
    if(seen[it.catId]) fail('A category appears more than once in the custom split.');
    if(!S.cats.get(it.catId)) fail('One of the categories in the custom split no longer exists.');
    seen[it.catId]=1;
    sum+=c;
    allocs.push({catId:it.catId, cents:c});
  });
  if(sum>cents) fail('The custom amounts add up to more than the income total ('+fmt(sum)+' > '+fmt(cents)+').');
  allocs.forEach(function(a){ a.bp = cents? Math.round(a.cents*10000/cents) : 0; });
  var bpSum=0; allocs.forEach(function(a){bpSum+=a.bp;});
  if(bpSum>10000 && allocs.length){ allocs[0].bp -= (bpSum-10000); if(allocs[0].bp<0) allocs[0].bp=0; }
  return {allocs:allocs, unallocated:cents-sum};
}

/* ---------- pure balance calculation ---------- */
function computeBalances(cats,income,expenses,adjustments){
  var b=new Map();
  cats.forEach(function(c){b.set(c.id,0);});
  income.forEach(function(i){i.allocs.forEach(function(a){b.set(a.catId,(b.get(a.catId)||0)+a.cents);});});
  expenses.forEach(function(e){b.set(e.catId,(b.get(e.catId)||0)-e.cents);});
  adjustments.forEach(function(j){b.set(j.catId,(b.get(j.catId)||0)+j.cents);});
  return b;
}

/* ---------- local database (IndexedDB) ---------- */
var DB_NAME='private-budget-db', DB_VER=1, STORES=['cats','income','expenses','adjustments','meta'];
var db=null;
var S={cats:new Map(),income:new Map(),expenses:new Map(),adjustments:new Map(),meta:new Map()};
function keyOf(store,rec){ return store==='meta'?rec.key:rec.id; }
function openDB(){
  return new Promise(function(res,rej){
    if(!window.indexedDB) return rej(new Error('This browser has no local database (IndexedDB). Private Browsing mode can cause this.'));
    var r=indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded=function(){ var d=r.result; STORES.forEach(function(s){ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:s==='meta'?'key':'id'}); }); };
    r.onsuccess=function(){res(r.result);};
    r.onerror=function(){rej(r.error||new Error('Could not open the local database.'));};
    r.onblocked=function(){rej(new Error('Database is blocked by another open copy of the app. Close other copies and reopen.'));};
  });
}
/* Some iPhones occasionally leave the first database request hanging when an app is launched from the Home Screen.
   If it does not answer within 5 seconds, ask again (up to 3 tries) and then show a clear message instead of a blank screen. */
function openWithRetry(){
  return new Promise(function(res,rej){
    var tries=0, settled=false;
    function attempt(){
      tries++;
      var timer=setTimeout(function(){
        if(settled) return;
        if(tries<3) attempt();
        else { settled=true; rej(new Error('The local database did not respond. Swipe the app away completely, then open it again.')); }
      },5000);
      openDB().then(function(d){ clearTimeout(timer); if(settled){ try{d.close();}catch(e){} return; } settled=true; res(d); },
                    function(e){ clearTimeout(timer); if(settled) return; settled=true; rej(e); });
    }
    attempt();
  });
}
function loadAll(){
  return Promise.all(STORES.map(function(s){
    return new Promise(function(res,rej){
      var q=db.transaction(s,'readonly').objectStore(s).getAll();
      q.onsuccess=function(){res([s,q.result]);}; q.onerror=function(){rej(q.error);};
    });
  })).then(function(all){
    all.forEach(function(p){ S[p[0]]=new Map(); p[1].forEach(function(rec){S[p[0]].set(keyOf(p[0],rec),rec);}); });
  });
}
/* commit(): all operations succeed together or none do (one IndexedDB transaction).
   Memory is only updated AFTER the database confirms the commit. */
function commit(ops){
  return new Promise(function(res,rej){
    var names=[]; ops.forEach(function(o){ if(names.indexOf(o.s)<0) names.push(o.s); });
    var tx; try{ tx=db.transaction(names,'readwrite'); }catch(e){ return rej(e); }
    tx.oncomplete=function(){
      ops.forEach(function(o){
        var m=S[o.s];
        if(o.clear) m.clear(); else if(o.del!==undefined) m.delete(o.del); else m.set(keyOf(o.s,o.put),o.put);
      });
      res();
    };
    tx.onerror=function(){rej(tx.error||new Error('Saving failed.'));};
    tx.onabort=function(){rej(tx.error||new Error('Saving was cancelled; nothing was changed.'));};
    try{
      ops.forEach(function(o){
        var st=tx.objectStore(o.s);
        if(o.clear) st.clear(); else if(o.del!==undefined) st.delete(o.del); else st.put(o.put);
      });
    }catch(e){ try{tx.abort();}catch(x){} rej(e); }
  });
}

/* ---------- data accessors ---------- */
function allCats(){ return Array.from(S.cats.values()).sort(function(a,b){return a.order-b.order;}); }
function activeCats(){ return allCats().filter(function(c){return !c.archived;}); }
/* Hierarchical listing: depth-first, children under their parent, sorted by order within each level. */
function catsTree(includeArchived){
  var list=includeArchived?allCats():activeCats();
  var byParent={}; list.forEach(function(c){ var k=c.parentId||''; (byParent[k]=byParent[k]||[]).push(c); });
  var out=[];
  function walk(pid, depth){
    (byParent[pid]||[]).forEach(function(c){ out.push({c:c,depth:depth}); walk(c.id, depth+1); });
  }
  walk('', 0);
  // Orphans whose parent is missing or archived (when not including archived)
  list.forEach(function(c){
    if(c.parentId && !list.some(function(x){return x.id===c.parentId;})){
      if(!out.some(function(x){return x.c.id===c.id;})) out.push({c:c,depth:0});
    }
  });
  return out;
}
function catPath(id){
  var parts=[], c=S.cats.get(id), guard=0;
  while(c && guard++<20){ parts.unshift(c.name); c=c.parentId?S.cats.get(c.parentId):null; }
  return parts.join(' › ');
}
/* ---------- weekly spendable ---------- */
function weekBounds(refDate, startsOn){
  // startsOn: 0=Sunday, 1=Monday
  var d=refDate?new Date(refDate+'T12:00:00'):new Date();
  var day=d.getDay(); // 0 Sun .. 6 Sat
  var diff=(day - startsOn + 7) % 7;
  var start=new Date(d); start.setDate(d.getDate()-diff);
  var end=new Date(start); end.setDate(start.getDate()+6);
  function ymd(x){ return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
  return {start:ymd(start), end:ymd(end)};
}
function getWeekly(){
  var m=S.meta.get('weekly');
  var def={cats:[], startsOn:0, targets:{}};
  if(!m||!m.value) return def;
  var v=m.value;
  return {cats:Array.isArray(v.cats)?v.cats.slice():[], startsOn:(v.startsOn===1?1:0), targets:(v.targets&&typeof v.targets==='object')?v.targets:{}};
}
function spentThisWeek(catId, bounds){
  var t=0;
  S.expenses.forEach(function(e){
    if(e.catId===catId && e.date>=bounds.start && e.date<=bounds.end) t+=e.cents;
  });
  return t;
}
function activeBpTotal(){ var t=0; activeCats().forEach(function(c){if(!c.isGroup) t+=c.bp;}); return t; }
function activeRules(){ return activeCats().filter(function(c){return !c.isGroup&&c.bp>0;}).map(function(c){return {catId:c.id,bp:c.bp};}); }
function moneyCats(){ return activeCats().filter(function(c){return !c.isGroup;}); }
function balances(){ return computeBalances(S.cats.values(),S.income.values(),S.expenses.values(),S.adjustments.values()); }
function catName(id){ var c=S.cats.get(id); return c?c.name:'(unknown)'; }
function cmpTx(a,b){ return b.date.localeCompare(a.date)||String(b.created||'').localeCompare(String(a.created||'')); }
function nameKey(s){ return String(s).trim().replace(/\s+/g,' ').toLowerCase(); }
function totalUnallocated(){ var t=0; S.income.forEach(function(i){t+=i.unallocated;}); return t; }

/* ---------- actions (all validation lives here) ---------- */
function fail(m){ throw new Error(m); }
function incDesc(v,fallback){ if(v===undefined) return fallback; v=titleCase(String(v)); if(!v) fail('Please enter a description (for example Payroll).'); if(v.length>200) fail('Description can be at most 200 characters.'); return v; }
function checkDate(d){ if(!validDate(d)) fail('Please choose a valid date.'); }
function checkAmount(c,what){ if(c===null||!Number.isSafeInteger(c)||c<=0||c>MAX_CENTS) fail('Enter a valid '+what+' greater than $0.00, for example 32.75.'); }
function checkAllocOk(){ if(activeBpTotal()>10000) fail('Your category percentages add up to more than 100%.\nFix them in Categories first, then try again.'); }
function dupName(name,exceptId){
  var k=nameKey(name), found=false;
  S.cats.forEach(function(c){ if(c.id!==exceptId && nameKey(c.name)===k) found=true; });
  return found;
}
var api={
  addCategory:function(name,bp,color,parentId,isGroup){
    name=titleCase(String(name||'').trim().replace(/\s+/g,' '));
    if(!name) fail('Please enter a category name.');
    if(name.length>60) fail('Category names can be at most 60 characters.');
    if(dupName(name)) fail('You already have a category named "'+name+'" (names are compared ignoring capitals and extra spaces).');
    isGroup=!!isGroup;
    if(isGroup){
      bp=0;
      if(parentId) fail('A group header cannot be nested under another category. Create it at the top level.');
    } else {
      bp=bp||0;
      if(!Number.isInteger(bp)||bp<0||bp>10000) fail('Invalid percentage.');
      if(activeBpTotal()+bp>10000) fail('That would make your percentages total more than 100%. Lower the percentage first.');
      if(parentId){
        var p=S.cats.get(parentId);
        if(!p) fail('Parent category not found.');
        if(p.archived) fail('Cannot nest under an archived category.');
      }
    }
    var order=0; S.cats.forEach(function(c){ if(c.order>order) order=c.order; });
    if(color!==undefined&&color!==null&&!HEXRE.test(String(color))) fail('Choose a valid color.');
    var rec={id:uid(),name:name,bp:bp,archived:false,order:order+1,created:new Date().toISOString(),color:color||autoColor(),parentId:parentId||null,isGroup:isGroup};
    return commit([{s:'cats',put:rec}]).then(function(){return rec;});
  },
  renameCategory:function(id,name){
    var c=S.cats.get(id); if(!c) fail('Category not found.');
    name=titleCase(String(name||'').trim().replace(/\s+/g,' '));
    if(!name) fail('Please enter a category name.');
    if(name.length>60) fail('Category names can be at most 60 characters.');
    if(dupName(name,id)) fail('You already have a category named "'+name+'".');
    var rec=Object.assign({},c,{name:name});
    return commit([{s:'cats',put:rec}]);
  },
  /* pcts: {catId: basisPoints}. Rejects (saves nothing) if the total exceeds 100%. */
  setAllocations:function(pcts){
    var total=0, ops=[];
    activeCats().forEach(function(c){
      if(c.isGroup) return;
      var bp=Object.prototype.hasOwnProperty.call(pcts,c.id)?pcts[c.id]:c.bp;
      if(!Number.isInteger(bp)||bp<0||bp>10000) fail('Invalid percentage for "'+c.name+'".');
      total+=bp;
      if(bp!==c.bp) ops.push({s:'cats',put:Object.assign({},c,{bp:bp})});
    });
    if(total>10000) fail('The percentages total '+pctStr(total)+'%, which is more than 100%.\nNothing was saved. Lower some percentages so the total is 100% or less.');
    if(!ops.length) return Promise.resolve({total:total,changed:0});
    return commit(ops).then(function(){return {total:total,changed:ops.length};});
  },
  archiveCategory:function(id){
    var c=S.cats.get(id); if(!c) fail('Category not found.');
    return commit([{s:'cats',put:Object.assign({},c,{archived:true})}]);
  },
  restoreCategory:function(id){
    var c=S.cats.get(id); if(!c) fail('Category not found.');
    var bp=c.bp; var reset=false;
    if(activeBpTotal()+bp>10000){ bp=0; reset=true; }
    return commit([{s:'cats',put:Object.assign({},c,{archived:false,bp:bp})}]).then(function(){return {reset:reset};});
  },
  moveCategory:function(id,dir){
    var c=S.cats.get(id); if(!c) fail('Category not found.');
    var siblings=activeCats().filter(function(x){ return (x.parentId||null)===(c.parentId||null); });
    var idx=-1; for(var i=0;i<siblings.length;i++) if(siblings[i].id===id){ idx=i; break; }
    if(idx<0) fail('Category not found.');
    var j=idx+dir;
    if(j<0||j>=siblings.length) return Promise.resolve();
    var a=siblings[idx], b=siblings[j];
    return commit([
      {s:'cats',put:Object.assign({},a,{order:b.order})},
      {s:'cats',put:Object.assign({},b,{order:a.order})}
    ]);
  },
  setParent:function(id,parentId){
    var c=S.cats.get(id); if(!c) fail('Category not found.');
    if(c.isGroup && parentId) fail('A group header must stay at the top level.');
    if(parentId){
      if(parentId===id) fail('A category cannot be its own parent.');
      var p=S.cats.get(parentId); if(!p) fail('Parent category not found.');
      if(p.archived) fail('Cannot nest under an archived category.');
      var walk=p;
      while(walk){
        if(walk.id===id) fail('That would create a circular hierarchy.');
        walk=walk.parentId?S.cats.get(walk.parentId):null;
      }
    }
    var order=0; S.cats.forEach(function(x){ if(x.order>order) order=x.order; });
    return commit([{s:'cats',put:Object.assign({},c,{parentId:parentId||null,order:order+1})}]);
  },
  setGroup:function(id,isGroup){
    var c=S.cats.get(id); if(!c) fail('Category not found.');
    isGroup=!!isGroup;
    if(isGroup){
      if(c.parentId) fail('Move this category to the top level before turning it into a group header.');
      // Cannot convert if it has money activity? Allow but force bp 0
      var bal=(balances().get(id)||0);
      if(bal!==0) fail('This category still has a balance of '+fmt(bal)+'. Move the money out (Adjust balance) before making it a group header.');
      return commit([{s:'cats',put:Object.assign({},c,{isGroup:true,bp:0})}]);
    }
    return commit([{s:'cats',put:Object.assign({},c,{isGroup:false})}]);
  },
  addIncome:function(p){
    if(S.income.has(p.id)) return Promise.resolve(S.income.get(p.id)); // duplicate tap
    checkDate(p.date);
    var src=titleCase(String(p.source||'').trim().replace(/\s+/g,' ')); if(!src) fail('Please enter where the money came from (the source).');
    if(src.length>120) fail('Source can be at most 120 characters.');
    checkAmount(p.cents,'income amount');
    var r, custom=!!p.custom;
    if(custom){
      r=customAllocate(p.cents, p.customAllocs||[]);
    } else {
      checkAllocOk();
      r=allocate(p.cents,activeRules());
    }
    var now=new Date().toISOString();
    var rec={id:p.id,date:p.date,source:src,desc:incDesc(p.desc,defIncome().desc),cents:p.cents,allocs:r.allocs,unallocated:r.unallocated,custom:custom,created:now,updated:now};
    return commit([{s:'income',put:rec}]).then(function(){return rec;});
  },
  /* Editing: keeps original split unless reallocate=true or a new custom split is provided. */
  editIncome:function(id,p){
    var old=S.income.get(id); if(!old) fail('Income record not found.');
    checkDate(p.date);
    var src=titleCase(String(p.source||'').trim().replace(/\s+/g,' ')); if(!src) fail('Please enter where the money came from (the source).');
    if(src.length>120) fail('Source can be at most 120 characters.');
    checkAmount(p.cents,'income amount');
    var r, custom=!!p.custom;
    if(custom){
      r=customAllocate(p.cents, p.customAllocs||[]);
    } else if(p.reallocate){
      checkAllocOk();
      r=allocate(p.cents,activeRules());
      custom=false;
    } else if(old.custom){
      var oldTotal=old.cents||1;
      var scaled=(old.allocs||[]).map(function(a){ return {catId:a.catId, cents:Math.round(a.cents*(p.cents/oldTotal))}; });
      var sum=0; scaled.forEach(function(x){sum+=x.cents;});
      if(sum>p.cents && scaled.length){ scaled[0].cents-=(sum-p.cents); if(scaled[0].cents<0) scaled[0].cents=0; }
      r=customAllocate(p.cents, scaled);
      custom=true;
    } else {
      var rules=old.allocs.map(function(a){return {catId:a.catId,bp:a.bp};});
      r=allocate(p.cents,rules);
    }
    var rec=Object.assign({},old,{date:p.date,source:src,desc:incDesc(p.desc,old.desc||defIncome().desc),cents:p.cents,allocs:r.allocs,unallocated:r.unallocated,custom:custom,updated:new Date().toISOString()});
    return commit([{s:'income',put:rec}]).then(function(){return rec;});
  },
  deleteIncome:function(id){ if(!S.income.has(id)) fail('Income record not found.'); return commit([{s:'income',del:id}]); },
  addExpense:function(p){
    if(S.expenses.has(p.id)) return Promise.resolve(S.expenses.get(p.id));
    checkDate(p.date); checkAmount(p.cents,'amount');
    var d=titleCase(String(p.desc||'')); if(!d) fail('Please enter a description.');
    if(d.length>200) fail('Description can be at most 200 characters.');
    var py=titleCase(String(p.payee||'').trim().replace(/\s+/g,' ')); if(!py) fail('Please enter the source: who or where the money went to.');
    if(py.length>120) fail('Source can be at most 120 characters.');
    var c=S.cats.get(p.catId); if(!c) fail('Please choose a category.');
    if(c.isGroup) fail('That is a group header, not a budget category. Choose Tithe, Gifts, or another real category.');
    if(c.archived) fail('That category is archived. Choose an active category.');
    var now=new Date().toISOString();
    var rec={id:p.id,date:p.date,cents:p.cents,desc:d,payee:py,catId:p.catId,created:now,updated:now};
    return commit([{s:'expenses',put:rec}]).then(function(){return rec;});
  },
  editExpense:function(id,p){
    var old=S.expenses.get(id); if(!old) fail('Expense not found.');
    checkDate(p.date); checkAmount(p.cents,'amount');
    var d=titleCase(String(p.desc||'')); if(!d) fail('Please enter a description.');
    if(d.length>200) fail('Description can be at most 200 characters.');
    var py=titleCase(String(p.payee||'').trim().replace(/\s+/g,' ')); if(!py) fail('Please enter the source: who or where the money went to.');
    if(py.length>120) fail('Source can be at most 120 characters.');
    var c=S.cats.get(p.catId); if(!c) fail('Please choose a category.');
    if(c.isGroup) fail('That is a group header, not a budget category. Choose a real category.');
    if(c.archived && p.catId!==old.catId) fail('That category is archived. Choose an active category.');
    var rec=Object.assign({},old,{date:p.date,cents:p.cents,desc:d,payee:py,catId:p.catId,updated:new Date().toISOString()});
    return commit([{s:'expenses',put:rec}]).then(function(){return rec;});
  },
  deleteExpense:function(id){ if(!S.expenses.has(id)) fail('Expense not found.'); return commit([{s:'expenses',del:id}]); },
  addAdjustment:function(p){
    if(S.adjustments.has(p.id)) return Promise.resolve(S.adjustments.get(p.id));
    checkDate(p.date);
    if(p.cents===null||!Number.isSafeInteger(p.cents)||p.cents===0) fail('Enter a non-zero amount, like 200.00 or -15.00.');
    if(Math.abs(p.cents)>MAX_CENTS) fail('Amount is too large.');
    var ac=S.cats.get(p.catId); if(!ac) fail('Category not found.');
    if(ac.isGroup) fail('Group headers do not hold balances.');
    var note=titleCase(String(p.note||'')); if(!note) fail('Please add a short note explaining the adjustment.');
    if(note.length>200) fail('Note can be at most 200 characters.');
    var rec={id:p.id,date:p.date,catId:p.catId,cents:p.cents,note:note,created:new Date().toISOString()};
    return commit([{s:'adjustments',put:rec}]).then(function(){return rec;});
  },
  deleteAdjustment:function(id){ if(!S.adjustments.has(id)) fail('Adjustment not found.'); return commit([{s:'adjustments',del:id}]); },
  setMeta:function(key,value){ return commit([{s:'meta',put:{key:key,value:value}}]); }
};

/* ---------- colors ---------- */
var HEXRE=/^#[0-9a-fA-F]{6}$/;
function autoColor(extraUsed){
  var used={}; activeCats().forEach(function(c){ if(c.color) used[c.color.toLowerCase()]=1; });
  (extraUsed||[]).forEach(function(x){ used[x.toLowerCase()]=1; });
  for(var i=0;i<PALETTE.length;i++) if(!used[PALETTE[i].toLowerCase()]) return PALETTE[i];
  return PALETTE[(S.cats.size+(extraUsed||[]).length)%PALETTE.length];
}
api.setCategoryColor=function(id,color){
  var c=S.cats.get(id); if(!c) fail('Category not found.');
  if(!HEXRE.test(String(color))) fail('Choose a valid color.');
  return commit([{s:'cats',put:Object.assign({},c,{color:color})}]);
};

/* ---------- CSV import of past spreadsheet data ---------- */
var MONTHS={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
function parseCsv(text){
  if(text.charCodeAt(0)===0xFEFF) text=text.slice(1);
  var head=text.split(/\r\n|\n|\r/).slice(0,6).join('\n'), d=',', best=-1;
  [',',';','\t'].forEach(function(x){ var n=head.split(x).length; if(n>best){best=n;d=x;} });
  var rows=[], row=[], f='', q=false, i=0, n=text.length, ch;
  while(i<n){
    ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){f+='"';i++;} else q=false; } else f+=ch; }
    else if(ch==='"'&&f===''){ q=true; }
    else if(ch===d){ row.push(f); f=''; }
    else if(ch==='\n'||ch==='\r'){
      if(ch==='\r'&&text[i+1]==='\n') i++;
      row.push(f); f='';
      if(!(row.length===1&&row[0]==='')) rows.push(row);
      row=[];
    }
    else f+=ch;
    i++;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return {rows:rows,delim:d};
}
function detectDateFmt(vals){
  var dm=false, md=false;
  vals.forEach(function(v){ var m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2}|\d{4})/.exec(String(v).trim()); if(m){ if(+m[1]>12) dm=true; if(+m[2]>12) md=true; } });
  return dm&&!md?'dmy':'mdy';
}
function fixYear(s){ var y=+s; if(s.length===2) y+= y<70?2000:1900; return y; }
function parseDateLoose(s,fmt){
  s=String(s==null?'':s).trim(); if(!s) return null;
  s=s.replace(/[ T]\d{1,2}:\d{2}(:\d{2})?(\.\d+)?\s*([AaPp][Mm])?\s*(Z|[+-]\d{2}:?\d{2})?$/,'');
  var m, y, mo, d;
  if(/^\d{5}$/.test(s)){ // spreadsheet serial date
    var n=+s; if(n<20000||n>80000) return null;
    var dt=new Date(Date.UTC(1899,11,30)+n*86400000); y=dt.getUTCFullYear(); mo=dt.getUTCMonth()+1; d=dt.getUTCDate();
  }
  else if((m=/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/.exec(s))){ y=+m[1]; mo=+m[2]; d=+m[3]; }
  else if((m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2}|\d{4})$/.exec(s))){ y=fixYear(m[3]); if(fmt==='dmy'){d=+m[1];mo=+m[2];} else {mo=+m[1];d=+m[2];} }
  else if((m=/^(\d{1,2})[ -]([A-Za-z]{3,9})\.?,?[ -](\d{2}|\d{4})$/.exec(s))){ d=+m[1]; mo=MONTHS[m[2].slice(0,3).toLowerCase()]; y=fixYear(m[3]); }
  else if((m=/^([A-Za-z]{3,9})\.? (\d{1,2}),? (\d{2}|\d{4})$/.exec(s))){ mo=MONTHS[m[1].slice(0,3).toLowerCase()]; d=+m[2]; y=fixYear(m[3]); }
  else return null;
  if(!mo) return null;
  var out=y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  return validDate(out)?out:null;
}
function parseAmountLoose(s){
  s=String(s==null?'':s).trim(); if(!s) return null;
  var neg=false;
  if(/^\(.*\)$/.test(s)){ neg=true; s=s.slice(1,-1).trim(); }
  if(/-$/.test(s)){ neg=true; s=s.slice(0,-1).trim(); }
  if(s[0]==='-'){ neg=true; s=s.slice(1).trim(); } else if(s[0]==='+'){ s=s.slice(1).trim(); }
  var c=parseMoney(s); if(c===null) return null;
  return neg?-c:c;
}
function hash2(str){
  var h1=0x811c9dc5, h2=5381;
  for(var i=0;i<str.length;i++){ var c=str.charCodeAt(i); h1^=c; h1=Math.imul(h1,16777619)>>>0; h2=((h2*33)^c)>>>0; }
  return h1.toString(16).padStart(8,'0')+h2.toString(16).padStart(8,'0');
}
function findCatByName(name){ var k=nameKey(name), f=null; S.cats.forEach(function(c){ if(!f&&nameKey(c.name)===k) f=c; }); return f; }
function defaultCatMap(key){ var c=findCatByName(key===''?'Uncategorized':key); return c?c.id:'new'; }
function defaultTypeMap(k){
  if(/^(inc|dep|cred|cr$|in$|rec|earn|sal|revenue)/.test(k)) return 'inc';
  if(/^(exp|wit|deb|dr$|out$|pur|spen|cost|bill|charge)/.test(k)) return 'exp';
  return 'skip';
}
function impCol(r,i){ return i>=0&&i<r.length?String(r[i]).trim():''; }
function addProb(an,row,msg){ an.problemCount++; if(an.problems.length<30) an.problems.push({row:row,msg:msg}); }
/* Reads every row and decides what it is, WITHOUT saving anything. */
function impAnalyze(rows,o){
  var an={exp:[],inc:[],problems:[],problemCount:0,skipped:0,dups:0,noDesc:0,catKeys:{},typeKeys:{},rowsSeen:0,expTotal:0,incTotal:0,min:'',max:''};
  var seen={}, start=o.hasHeader?1:0;
  for(var i=start;i<rows.length;i++){
    var r=rows[i], rowNo=i+1;
    if(r.every(function(c){return !String(c).trim();})) continue;
    an.rowsSeen++;
    var date=parseDateLoose(impCol(r,o.cols.date),o.dateFmt);
    if(!date){ addProb(an,rowNo,'Unreadable date "'+impCol(r,o.cols.date)+'"'); continue; }
    var amt=parseAmountLoose(impCol(r,o.cols.amt));
    if(amt===null){ addProb(an,rowNo,'Unreadable amount "'+impCol(r,o.cols.amt)+'"'); continue; }
    if(amt===0){ addProb(an,rowNo,'Amount is zero'); continue; }
    if(Math.abs(amt)>MAX_CENTS){ addProb(an,rowNo,'Amount is too large'); continue; }
    var kind, mode=o.mode;
    if(mode==='exp-pos'||mode==='inc-pos'){
      if(amt<0){ addProb(an,rowNo,'Negative amount '+fmt(amt)+' in a file you said has only '+(mode==='exp-pos'?'expenses':'income')+' as positive numbers'); continue; }
      kind=mode==='exp-pos'?'exp':'inc';
    }
    else if(mode==='signed-in') kind=amt>0?'inc':'exp';
    else if(mode==='signed-out') kind=amt>0?'exp':'inc';
    else {
      var tv=impCol(r,o.cols.type), tk=nameKey(tv);
      var te=an.typeKeys[tk]||(an.typeKeys[tk]={name:tv||'(blank)',count:0}); te.count++;
      var tm=o.typeMap[tk]; if(tm===undefined){ tm=defaultTypeMap(tk); o.typeMap[tk]=tm; }
      if(tm==='skip'){ an.skipped++; continue; }
      kind=tm;
    }
    var cents=Math.abs(amt);
    var dv=titleCase(impCol(r,o.cols.desc)).slice(0,200), pv=impCol(r,o.cols.payee).replace(/\s+/g,' ').slice(0,120);
    var desc, payee='', src='';
    if(kind==='inc'){ src=pv||dv.slice(0,120)||'(unknown source)'; desc=(pv&&dv)?dv:defIncome().desc; }
    else { payee=pv; desc=dv; if(!desc){ desc='(no description)'; an.noDesc++; } }
    var ckey='';
    if(kind==='exp'){
      var cv=impCol(r,o.cols.cat); ckey=nameKey(cv);
      var ce=an.catKeys[ckey]||(an.catKeys[ckey]={name:ckey===''?'Uncategorized':cv.replace(/\s+/g,' ').slice(0,60),count:0}); ce.count++;
      var cm=o.catMap[ckey]; if(cm===undefined){ cm=defaultCatMap(ckey); o.catMap[ckey]=cm; }
      if(cm==='skip'){ an.skipped++; continue; }
    }
    var base=kind+'|'+date+'|'+(kind==='inc'?src:desc).toLowerCase()+'|'+cents+'|'+ckey+(kind==='exp'&&payee?'|'+payee.toLowerCase():''), occ=(seen[base]=(seen[base]||0)+1);
    var id='imp-'+hash2(base+'|'+occ);
    if((kind==='exp'?S.expenses:S.income).has(id)){ an.dups++; continue; }
    var rec={id:id,date:date,cents:cents,desc:desc,ckey:ckey,payee:payee,src:src};
    if(!an.min||date<an.min) an.min=date; if(!an.max||date>an.max) an.max=date;
    if(kind==='exp'){ an.exp.push(rec); an.expTotal+=cents; } else { an.inc.push(rec); an.incTotal+=cents; }
  }
  return an;
}
/* Saves everything in ONE database transaction: all rows are added, or none are. */
api.applyImport=function(an,o,fileName){
  if(!an.exp.length&&!an.inc.length) fail('There is nothing to import.');
  if(o.split==='current'&&an.inc.length) checkAllocOk();
  var now=new Date().toISOString(), batch='batch-'+uid(), ops=[], newIds=[], newColors=[], keyToCat={};
  var order=0; S.cats.forEach(function(c){ if(c.order>order) order=c.order; });
  var needed={}; an.exp.forEach(function(r){ needed[r.ckey]=1; });
  Object.keys(needed).forEach(function(k){
    var m=o.catMap[k];
    if(m==='new'){
      var nm=an.catKeys[k].name, ex=findCatByName(nm);
      if(ex) keyToCat[k]=ex.id;
      else { order++; var col=autoColor(newColors); newColors.push(col); var rec={id:uid(),name:nm,bp:0,archived:false,order:order,created:now,color:col}; ops.push({s:'cats',put:rec}); keyToCat[k]=rec.id; newIds.push(rec.id); }
    } else { if(!S.cats.has(m)) fail('A category you chose no longer exists.'); keyToCat[k]=m; }
  });
  var rules=o.split==='current'?activeRules():[];
  an.exp.forEach(function(r){ ops.push({s:'expenses',put:{id:r.id,date:r.date,cents:r.cents,desc:r.desc,payee:r.payee,catId:keyToCat[r.ckey],created:now,updated:now,batch:batch}}); });
  an.inc.forEach(function(r){ var a=allocate(r.cents,rules); ops.push({s:'income',put:{id:r.id,date:r.date,source:r.src,desc:r.desc,cents:r.cents,allocs:a.allocs,unallocated:a.unallocated,created:now,updated:now,batch:batch}}); });
  var list=(S.meta.get('imports')?S.meta.get('imports').value:[]).slice(-9);
  list.push({id:batch,when:now,file:fileName||'',exp:an.exp.length,inc:an.inc.length,newCats:newIds});
  ops.push({s:'meta',put:{key:'imports',value:list}});
  return commit(ops).then(function(){ return {exp:an.exp.length,inc:an.inc.length,newCats:newIds.length,batch:batch}; });
};
api.undoImport=function(batchId){
  var list=S.meta.get('imports')?S.meta.get('imports').value:[], ent=list.filter(function(x){return x.id===batchId;})[0];
  if(!ent) fail('That import is no longer in the list.');
  var ops=[], gone={};
  S.expenses.forEach(function(e){ if(e.batch===batchId){ ops.push({s:'expenses',del:e.id}); gone[e.id]=1; } });
  S.income.forEach(function(i){ if(i.batch===batchId) ops.push({s:'income',del:i.id}); });
  (ent.newCats||[]).forEach(function(cid){
    if(!S.cats.has(cid)) return;
    var used=false;
    S.expenses.forEach(function(e){ if(e.catId===cid&&!gone[e.id]) used=true; });
    S.income.forEach(function(i){ if(i.batch!==batchId) i.allocs.forEach(function(a){ if(a.catId===cid) used=true; }); });
    S.adjustments.forEach(function(j){ if(j.catId===cid) used=true; });
    if(!used) ops.push({s:'cats',del:cid});
  });
  ops.push({s:'meta',put:{key:'imports',value:list.filter(function(x){return x.id!==batchId;})}});
  return commit(ops).then(function(){ return {removed:ops.length-1}; });
};
function guessCols(rows,hasHeader){
  var head=hasHeader?rows[0].map(function(x){return String(x).toLowerCase();}):[], ncols=0;
  rows.slice(0,60).forEach(function(r){ if(r.length>ncols) ncols=r.length; });
  var sample=rows.slice(hasHeader?1:0,hasHeader?41:40), cols={date:-1,desc:-1,amt:-1,cat:-1,type:-1,payee:-1};
  var re={date:/date|when|day/,type:/^type$|kind|in\/out|income\/expense|dr\/cr/,cat:/categ|bucket|envelope/,amt:/amount|amt|value|total|sum|price|cost|debit|credit/,payee:/payee|merchant|vendor|source|paid to|store|where/,desc:/desc|memo|detail|note|item|what|name/};
  function taken(i){ return Object.keys(cols).some(function(k){return cols[k]===i;}); }
  ['date','type','cat','amt','payee','desc'].forEach(function(k){ head.forEach(function(h,i){ if(cols[k]<0&&re[k].test(h)&&!taken(i)) cols[k]=i; }); });
  function score(i,fn){ var n=0,t=0; sample.forEach(function(r){ var v=impCol(r,i); if(v){ t++; if(fn(v)) n++; } }); return t?n/t:0; }
  if(cols.date<0){ var b=0.6; for(var i=0;i<ncols;i++){ var s=score(i,function(v){return parseDateLoose(v,'mdy')!==null;}); if(s>b&&!taken(i)){b=s;cols.date=i;} } }
  if(cols.amt<0){ var b2=0.6; for(var j=0;j<ncols;j++){ var s2=score(j,function(v){return parseAmountLoose(v)!==null&&parseDateLoose(v,'mdy')===null;}); if(s2>b2&&!taken(j)){b2=s2;cols.amt=j;} } }
  if(cols.desc<0){ for(var k2=0;k2<ncols;k2++){ if(!taken(k2)&&score(k2,function(v){return parseAmountLoose(v)===null;})>0.5){ cols.desc=k2; break; } } }
  return cols;
}
function guessMode(rows,o){
  if(o.cols.type>=0) return 'type';
  var neg=false; rows.slice(o.hasHeader?1:0,400).forEach(function(r){ var a=parseAmountLoose(impCol(r,o.cols.amt)); if(a!==null&&a<0) neg=true; });
  return neg?'signed-in':'exp-pos';
}
var imp=null;
function impStart(text,fileName){
  var p=parseCsv(text);
  if(p.rows.length<1) throw new Error('That file looks empty.');
  if(p.rows.length>300000) throw new Error('That file has more than 300,000 rows. Split it into smaller files.');
  var first=p.rows[0], hasHeader=!first.some(function(c){ return parseDateLoose(c,'mdy')!==null; });
  var ncols=0; p.rows.slice(0,200).forEach(function(r){ if(r.length>ncols) ncols=r.length; });
  imp={rows:p.rows,delim:p.delim,fileName:fileName,hasHeader:hasHeader,ncols:ncols,catMap:{},typeMap:{},split:'current'};
  imp.cols=guessCols(p.rows,hasHeader);
  imp.mode=guessMode(p.rows,imp);
  imp.dateFmt=detectDateFmt(p.rows.slice(hasHeader?1:0,500).map(function(r){return impCol(r,imp.cols.date);}));
  impModalA();
}
function letter(i){ return String.fromCharCode(65+i%26)+(i>=26?Math.floor(i/26):''); }
function impColLabel(i){
  var h=imp.hasHeader?String(imp.rows[0][i]||'').trim():'', ex='';
  for(var k=imp.hasHeader?1:0;k<imp.rows.length&&k<10;k++){ var v=String(imp.rows[k][i]||'').trim(); if(v){ex=v;break;} }
  return letter(i)+': '+(h||'(no name)')+(ex?'  e.g. '+ex.slice(0,18):'');
}
function colSel(id,label,val,opt){
  var o=opt?'<option value="-1"'+(val<0?' selected':'')+'>(none)</option>':'';
  for(var i=0;i<imp.ncols;i++) o+='<option value="'+i+'"'+(val===i?' selected':'')+'>'+esc(impColLabel(i))+'</option>';
  return '<label>'+label+'<select id="'+id+'">'+o+'</select></label>';
}

api.setBalances=function(items,date){
  checkDate(date);
  var b=balances(), ops=[], now=new Date().toISOString();
  items.forEach(function(it){
    var c=S.cats.get(it.catId); if(!c) fail('Category not found.');
    if(!Number.isSafeInteger(it.target)||it.target<0||it.target>MAX_CENTS) fail('Invalid balance for "'+c.name+'".');
    var delta=it.target-(b.get(c.id)||0);
    if(Math.abs(delta)>MAX_CENTS) fail('The change for "'+c.name+'" is too large.');
    if(delta!==0) ops.push({s:'adjustments',put:{id:uid(),date:date,catId:c.id,cents:delta,note:'Balance Set Manually to '+fmt(it.target),created:now}});
  });
  if(!ops.length) fail('Nothing to change: every balance you entered is already correct.');
  return commit(ops).then(function(){ return {changed:ops.length}; });
};

function defIncome(){ var m=S.meta.get('incomeDefaults'); return (m&&m.value&&m.value.source)?m.value:{source:'Sound Mind',desc:'Payroll'}; }
api.setIncomeDefaults=function(source,desc){
  source=titleCase(String(source||'').trim().replace(/\s+/g,' ')); desc=titleCase(String(desc||''));
  if(!source) fail('Please enter a default source.'); if(source.length>120) fail('Source can be at most 120 characters.');
  if(!desc) fail('Please enter a default description.'); if(desc.length>200) fail('Description can be at most 200 characters.');
  return commit([{s:'meta',put:{key:'incomeDefaults',value:{source:source,desc:desc}}}]);
};
api.setWeekly=function(cfg){
  var cats=[], seen={};
  (cfg.cats||[]).forEach(function(id){
    if(!S.cats.get(id)) return;
    if(seen[id]) return;
    seen[id]=1; cats.push(id);
  });
  var startsOn=cfg.startsOn===1?1:0;
  var targets={};
  if(cfg.targets&&typeof cfg.targets==='object'){
    Object.keys(cfg.targets).forEach(function(id){
      if(!seen[id]) return;
      var c=cfg.targets[id];
      if(c===null||c===undefined||c==='') return;
      if(!Number.isSafeInteger(c)||c<0||c>MAX_CENTS) fail('Weekly target must be a valid amount ≥ $0.00.');
      targets[id]=c;
    });
  }
  return commit([{s:'meta',put:{key:'weekly',value:{cats:cats,startsOn:startsOn,targets:targets}}}]);
};

/* ---------- backup: build, validate, restore ---------- */
function buildBackup(){
  var b=balances(), bal={}; b.forEach(function(v,k){bal[k]=v;});
  var cats=allCats(), inc=Array.from(S.income.values()).sort(cmpTx), exp=Array.from(S.expenses.values()).sort(cmpTx), adj=Array.from(S.adjustments.values()).sort(cmpTx);
  return {app:'private-budget',format:1,currency:'USD',exported:new Date().toISOString(),
    counts:{categories:cats.length,income:inc.length,expenses:exp.length,adjustments:adj.length},
    settings:{incomeSource:defIncome().source,incomeDesc:defIncome().desc},balances:bal,categories:cats,income:inc,expenses:exp,adjustments:adj};
}
function validateBackup(o){
  var errs=[]; function bad(m){ if(errs.length<15) errs.push(m); }
  if(!o||typeof o!=='object'||Array.isArray(o)||o.app!=='private-budget'){ return ['This file is not a backup made by this app.']; }
  if(o.format!==1) return ['This backup has format version '+o.format+', which this version of the app cannot read.'];
  ['categories','income','expenses','adjustments'].forEach(function(k){ if(!Array.isArray(o[k])) bad('The backup is missing its "'+k+'" list.'); });
  if(errs.length) return errs;
  var isInt=Number.isSafeInteger, seen={};
  function uniq(kind,id){ if(typeof id!=='string'||!id){bad(kind+' record without a valid id.');return false;} if(seen[kind+id]){bad('Duplicate '+kind+' id.');return false;} seen[kind+id]=1; return true; }
  var catIds={}, activeBp=0;
  o.categories.forEach(function(c){
    if(!c||typeof c!=='object') return bad('A category record is damaged.');
    if(!uniq('category',c.id)) return; catIds[c.id]=1;
    if(typeof c.name!=='string'||!c.name.trim()) bad('A category has no name.');
    if(!isInt(c.bp)||c.bp<0||c.bp>10000) bad('Category "'+c.name+'" has an invalid percentage.');
    if(c.color!==undefined&&!HEXRE.test(String(c.color))) bad('Category "'+c.name+'" has an invalid color.');
    if(typeof c.archived!=='boolean') bad('Category "'+c.name+'" has an invalid archived flag.');
    if(!isInt(c.order)) bad('Category "'+c.name+'" has an invalid order.');
    if(c.archived===false&&isInt(c.bp)) activeBp+=c.bp;
  });
  if(activeBp>10000) bad('Active category percentages total more than 100%.');
  o.income.forEach(function(i){
    if(!i||typeof i!=='object') return bad('An income record is damaged.');
    if(!uniq('income',i.id)) return;
    if(!validDate(i.date)) bad('An income record has an invalid date.');
    if(typeof i.source!=='string'||!i.source.trim()) bad('An income record has no source.');
    if(i.desc!==undefined&&typeof i.desc!=='string') bad('An income record has an invalid description.');
    if(!isInt(i.cents)||i.cents<=0||i.cents>MAX_CENTS) bad('An income record has an invalid amount.');
    if(!Array.isArray(i.allocs)) return bad('An income record has no allocation details.');
    var sum=0, bp=0;
    i.allocs.forEach(function(a){
      if(!a||!catIds[a.catId]) bad('An income allocation points to a category that is not in the backup.');
      if(!a||!isInt(a.cents)||a.cents<0||!isInt(a.bp)||a.bp<0||a.bp>10000) bad('An income allocation has invalid numbers.');
      else {sum+=a.cents;bp+=a.bp;}
    });
    if(!isInt(i.unallocated)||i.unallocated<0) bad('An income record has an invalid unallocated amount.');
    else if(isInt(i.cents)&&sum+i.unallocated!==i.cents) bad('Income "'+i.source+'" on '+i.date+': allocations plus unallocated do not equal the income amount.');
    if(bp>10000) bad('An income record used more than 100% in total.');
  });
  o.expenses.forEach(function(e){
    if(!e||typeof e!=='object') return bad('An expense record is damaged.');
    if(!uniq('expense',e.id)) return;
    if(!validDate(e.date)) bad('An expense has an invalid date.');
    if(!isInt(e.cents)||e.cents<=0||e.cents>MAX_CENTS) bad('An expense has an invalid amount.');
    if(typeof e.desc!=='string'||!e.desc.trim()) bad('An expense has no description.');
    if(e.payee!==undefined&&typeof e.payee!=='string') bad('An expense has an invalid source.');
    if(!catIds[e.catId]) bad('An expense points to a category that is not in the backup.');
  });
  o.adjustments.forEach(function(j){
    if(!j||typeof j!=='object') return bad('An adjustment record is damaged.');
    if(!uniq('adjustment',j.id)) return;
    if(!validDate(j.date)) bad('An adjustment has an invalid date.');
    if(!isInt(j.cents)||j.cents===0) bad('An adjustment has an invalid amount.');
    if(!catIds[j.catId]) bad('An adjustment points to a category that is not in the backup.');
    if(typeof j.note!=='string') bad('An adjustment has no note.');
  });
  if(!errs.length&&o.balances&&typeof o.balances==='object'){
    var b=computeBalances(o.categories,o.income,o.expenses,o.adjustments);
    b.forEach(function(v,k){ if(o.balances[k]!==undefined&&o.balances[k]!==v) bad('Stored balance for a category does not match its transactions (file may be damaged).'); });
  }
  return errs;
}
function restoreBackup(o){
  var errs=validateBackup(o); if(errs.length) return Promise.reject(new Error(errs.join('\n')));
  var ops=[{s:'cats',clear:true},{s:'income',clear:true},{s:'expenses',clear:true},{s:'adjustments',clear:true}];
  if(o.settings&&typeof o.settings.incomeSource==='string'&&o.settings.incomeSource.trim()) ops.push({s:'meta',put:{key:'incomeDefaults',value:{source:o.settings.incomeSource.trim(),desc:(typeof o.settings.incomeDesc==='string'&&o.settings.incomeDesc.trim())?o.settings.incomeDesc.trim():'Payroll'}}});
  o.categories.forEach(function(c){ops.push({s:'cats',put:Object.assign({id:c.id,name:c.name.trim(),bp:c.isGroup?0:c.bp,archived:c.archived,order:c.order,created:c.created||new Date().toISOString(),parentId:c.parentId||null,isGroup:!!c.isGroup},HEXRE.test(String(c.color))?{color:c.color}:{})});});
  o.income.forEach(function(i){ops.push({s:'income',put:Object.assign({id:i.id,date:i.date,source:i.source,cents:i.cents,allocs:i.allocs.map(function(a){return {catId:a.catId,bp:a.bp,cents:a.cents};}),unallocated:i.unallocated,created:i.created||'',updated:i.updated||''},typeof i.desc==='string'&&i.desc?{desc:i.desc}:{})});});
  o.expenses.forEach(function(e){ops.push({s:'expenses',put:Object.assign({id:e.id,date:e.date,cents:e.cents,desc:e.desc,catId:e.catId,created:e.created||'',updated:e.updated||''},typeof e.payee==='string'&&e.payee?{payee:e.payee}:{})});});
  o.adjustments.forEach(function(j){ops.push({s:'adjustments',put:{id:j.id,date:j.date,catId:j.catId,cents:j.cents,note:j.note,created:j.created||''}});});
  // One database transaction: everything is replaced, or (on any error) nothing changes.
  return commit(ops).then(function(){ return integrity(); });
}

function pieHtml(id,items,emptyMsg){
  items=items.filter(function(x){return x.val>0;});
  var tot=0; items.forEach(function(x){tot+=x.val;});
  if(!tot){ charts[id]=[]; return '<div class="muted" style="padding:10px 0">'+esc(emptyMsg)+'</div>'; }
  charts[id]=items.map(function(x){return {label:x.label,val:x.val,pct:(x.val/tot*100).toFixed(1),color:x.color};});
  var svg='<svg viewBox="0 0 220 220" class="pie" role="img" aria-label="Pie chart. Tap a slice for details.">';
  if(items.length===1){ svg+='<circle data-act="slice" data-c="'+id+'" data-i="0" cx="110" cy="110" r="100" fill="'+items[0].color+'"/>'; }
  else{
    var a=-Math.PI/2;
    items.forEach(function(x,i){
      var f=x.val/tot, b=a+f*2*Math.PI;
      var x1=110+100*Math.cos(a), y1=110+100*Math.sin(a), x2=110+100*Math.cos(b), y2=110+100*Math.sin(b);
      svg+='<path data-act="slice" data-c="'+id+'" data-i="'+i+'" d="M110 110 L'+x1.toFixed(2)+' '+y1.toFixed(2)+' A100 100 0 '+(f>0.5?1:0)+' 1 '+x2.toFixed(2)+' '+y2.toFixed(2)+' Z" fill="'+x.color+'"/>';
      a=b;
    });
  }
  svg+='</svg>';
  var lg=charts[id].map(function(x,i){return '<div class="lg" data-act="slice" data-c="'+id+'" data-i="'+i+'"><i style="background:'+x.color+'"></i><span>'+esc(x.label)+'</span><b>'+fmt(x.val)+'</b><em>'+x.pct+'%</em></div>';}).join('');
  return svg+'<div class="cap" id="cap-'+id+'">Tap a slice for details</div>'+lg;
}

function suggestionList(collect, limit){
  var m=new Map();
  collect(function(val){
    val=String(val||'').trim().replace(/\s+/g,' ');
    if(!val) return;
    var k=nameKey(val), g=m.get(k);
    if(!g){ g={n:val,c:0}; m.set(k,g); }
    g.c++;
  });
  return Array.from(m.values()).sort(function(a,b){return b.c-a.c||a.n.localeCompare(b.n);}).slice(0,limit||60).map(function(g){return g.n;});
}

function incomePreview(){
  var el=$('#preview'); if(!el) return;
  var c=parseMoney($('#f-amt').value);
  var customCb=$('#f-custom'), isCustom=customCb&&customCb.checked;
  var re=$('#f-re'), id=($('#save-inc')||{}).dataset?$('#save-inc').dataset.id:'';
  if(c===null||c<=0){ el.innerHTML='<span class="muted">Enter an amount to preview how it will be split.</span>'; return; }
  if(isCustom){
    var items=[], sum=0, bad=false;
    document.querySelectorAll('[data-custom-amt]').forEach(function(inp){
      var raw=inp.value.trim();
      if(raw==='') return;
      var v=parseMoney(raw);
      if(v===null){ bad=true; return; }
      if(v>0){ items.push({catId:inp.dataset.customAmt,cents:v}); sum+=v; }
    });
    if(bad){ el.innerHTML='<span class="neg">Enter valid amounts (for example 50.00).</span>'; return; }
    if(sum>c){ el.innerHTML='<span class="neg">Custom amounts total '+fmt(sum)+', which is more than the income ('+fmt(c)+').</span>'; return; }
    var h='<div class="muted">Custom split:</div>';
    items.forEach(function(a){ h+='<div class="hd"><span>'+esc(catName(a.catId))+'</span><b>'+fmt(a.cents)+'</b></div>'; });
    if(c-sum>0) h+='<div class="hd warn"><span>Unallocated</span><b>'+fmt(c-sum)+'</b></div>';
    if(!items.length) h+='<div class="warn">No amounts entered — the whole income will stay unallocated.</div>';
    el.innerHTML=h;
    return;
  }
  var rules;
  if(id&&!(re&&re.checked)){
    var old=S.income.get(id);
    if(old&&old.custom){
      var oldTotal=old.cents||1;
      var scaled=(old.allocs||[]).map(function(a){ return {catId:a.catId, cents:Math.round(a.cents*(c/oldTotal))}; });
      var ssum=0; scaled.forEach(function(x){ssum+=x.cents;});
      if(ssum>c&&scaled.length){ scaled[0].cents-=(ssum-c); if(scaled[0].cents<0) scaled[0].cents=0; }
      var h2='<div class="muted">Keeping previous custom split (scaled):</div>';
      scaled.filter(function(a){return a.cents>0;}).forEach(function(a){ h2+='<div class="hd"><span>'+esc(catName(a.catId))+'</span><b>'+fmt(a.cents)+'</b></div>'; });
      var left=c; scaled.forEach(function(a){left-=a.cents;});
      if(left>0) h2+='<div class="hd warn"><span>Unallocated</span><b>'+fmt(left)+'</b></div>';
      el.innerHTML=h2;
      return;
    }
    rules=(old?old.allocs:[]).map(function(a){return {catId:a.catId,bp:a.bp};});
  } else {
    if(activeBpTotal()>10000){ el.innerHTML='<span class="neg">Percentages total more than 100%. Fix them in Categories first.</span>'; return; }
    rules=activeRules();

function adjCompute(){

  if(raw==='') return {err:'Enter an amount.',cur:cur};
  var v=parseMoney(raw);
  if(v===null) return {err:'Enter an amount like 500.00. For a negative change, choose "Take money away" (no minus sign needed).',cur:cur};
  var delta=mode==='set'?v-cur:mode==='add'?v:-v;

}

/* ---------- backup delivery ---------- */
function deliver(filename,text,mime){
  var file=null;
  try{ file=new File([text],filename,{type:mime}); }catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    return navigator.share({files:[file],title:filename}).then(function(){return true;},function(e){ if(e&&e.name==='AbortError') return false; return download(); });
  }
  return Promise.resolve(download());
  function download(){
    var url=URL.createObjectURL(new Blob([text],{type:mime})), a=document.createElement('a');
    a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);},30000); return true;
  }
}

  'export-csv':function(){ ask(CLOUD_WARN,'Continue').then(function(ok){ if(!ok) return; deliver('budget-transactions-'+today()+'.csv',buildCsv(),'text/csv'); }); },
  'pick-restore':function(){ var f=$('#restore-file'); f.value=''; f.click(); },
  integrity:function(){ var e=integrity(); $('#integ').innerHTML=e.length?'<span class="neg">Problems found:\n'+esc(e.join('\n'))+'</span>':'<span class="pos">All checks passed: allocations add up to every income amount, every record points to a real category, and balances match the transaction history.</span>'; },
  erase:function(){ ask('This permanently deletes ALL categories and transactions on this phone. It cannot be undone.\n\nIf you have not exported a backup, do that first.','Erase everything',true,'<label>Type ERASE to confirm<input id="dlg-type" data-need="ERASE" autocapitalize="characters"></label>').then(function(ok){ if(!ok) return; guarded(null,function(){ return eraseAll().then(function(){ render(); toast('All data erased'); }); }); }); }
};
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]'); if(!t) return;
  var f=H[t.dataset.act]; if(f) f(t,e);
});
document.addEventListener('change',function(e){
  var t=e.target, c=t.dataset&&t.dataset.chg;
  if(c==='period'){ var st=ui[t.dataset.k]; if(t.type==='month'){ if(/^\d{4}-\d{2}$/.test(t.value)) st.month=t.value; } else st.year=t.value; st.lim=200; render(); }
  else if(c==='flt'){ var s=ui[t.dataset.k]; if(t.id.slice(-3)==='cat') s.cat=t.value; else s.sort=t.value; s.lim=200; refreshList(t.dataset.k); if(t.dataset.k==='exp'&&c==='flt'&&t.id.slice(-3)==='cat') $('#exp-src').innerHTML=srcHtml('exp'); }
  else if(t.id==='restore-file'&&t.files&&t.files[0]) startRestore(t.files[0]);
  else if(t.id==='import-file'&&t.files&&t.files[0]){ var fl=t.files[0], rd2=new FileReader(); rd2.onerror=function(){ setErr('Could not read that file.'); }; rd2.onload=function(){ try{ impStart(String(rd2.result),fl.name); }catch(x){ setErr(x.message); } }; rd2.readAsText(fl); }
  else if(c==='imhdr'&&imp){ impReadA(); imp.hasHeader=t.checked; imp.cols=guessCols(imp.rows,imp.hasHeader); impModalA(); }
  else if(c==='imcat'&&imp){ imp.catMap[imp.catKeyList[+t.dataset.i]]=t.value; impModalB(true); }
  else if(c==='imtype'&&imp){ imp.typeMap[imp.typeKeyList[+t.dataset.i]]=t.value; impModalB(true); }
  else if(t.id==='f-custom'){
    var box=$('#custom-box'), pctOpts=$('#pct-opts');
    if(box) box.style.display=t.checked?'':'none';
    if(pctOpts) pctOpts.style.display=t.checked?'none':'';
    if(t.checked&&box&&!box.querySelector('[data-custom-amt]')) box.innerHTML=customSplitHtml(null);
    incomePreview();
  }
  else if(t.dataset&&t.dataset.inp==='incprev') incomePreview();
  else if(t.dataset&&t.dataset.inp==='adjprev') adjPreview();
});
document.addEventListener('focusout',function(e){
  var t=e.target;
  if(!t||!t.value||t.tagName!=='INPUT') return;
  var ids={'f-desc':1,'f-idesc':1,'f-payee':1,'f-src':1,'nc-name':1,'nc-name2':1,'dlg-name':1,'df-src':1,'df-desc':1};
  if(ids[t.id]){ var v=titleCase(t.value); if(v!==t.value) t.value=v; }
});
document.addEventListener('input',function(e){
  var t=e.target, k=t.dataset&&t.dataset.inp;
  if(k==='q'){ ui[t.dataset.k].q=t.value; ui[t.dataset.k].lim=200; t.dataset.k==='exp'?($('#exp-list').innerHTML=expListHtml()):($('#inc-list').innerHTML=incListHtml()); }
  else if(k==='pct') updatePctTotal();
  else if(k==='incprev') incomePreview();
  else if(k==='adjprev') adjPreview();
});
function startRestore(file){
  var rd=new FileReader();
  rd.onerror=function(){ setErr('Could not read that file.'); };
  rd.onload=function(){
    var o; try{ o=JSON.parse(rd.result); }catch(x){ setErr('That file is not a valid backup (it could not be read as JSON).'); return; }
    var errs=validateBackup(o);
    if(errs.length){ setErr('This backup cannot be restored. Nothing was changed.\n• '+errs.join('\n• ')); return; }
    setErr('');
    var cur=S.income.size+S.expenses.size+S.adjustments.size+S.cats.size;
    ask('Restore this backup?\n\nBackup made: '+new Date(o.exported).toLocaleString()+'\nContains: '+o.categories.length+' categories, '+o.income.length+' income, '+o.expenses.length+' expenses, '+o.adjustments.length+' adjustments.\n\nThis REPLACES everything currently in the app'+(cur?' ('+S.cats.size+' categories, '+S.income.size+' income, '+S.expenses.size+' expenses)':'')+'. It does not merge. If anything goes wrong, nothing is changed.','Replace my data',true).then(function(ok){
      if(!ok) return;
      restoreBackup(o).then(function(problems){ render(); toast(problems.length?'Restored, but a check found problems':'Restored and verified'); },function(e){ setErr('Restore failed; nothing was changed.\n'+e.message); });
    });
  };
  rd.readAsText(file);
}

/* ---------- start ---------- */
function init(){
  $('#tabs').innerHTML=[['dash','Home'],['weekly','Weekly'],['exp','Spending'],['inc','Income'],['acct','Accounts'],['cat','Categories'],['set','Settings']].map(function(t){return '<button data-act="tab" data-v="'+t[0]+'">'+t[1]+'</button>';}).join('');
  return openWithRetry().then(function(d){ db=d; return loadAll(); }).then(function(){
    render();
    try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
    try{ if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(function(){}); }catch(e){}
  }).catch(function(e){
    $('#view').innerHTML='<div class="banner neg"><b>The app could not open its local database.</b><br>'+esc(e&&e.message?e.message:e)+'<br><br>Nothing was changed. </div><button class="btn" data-act="reload">Try again</button>';
  });
}
window.__budget={titleCase:titleCase,srcGroups:srcGroups,srcHtml:srcHtml,parseCsv:parseCsv,parseDateLoose:parseDateLoose,parseAmountLoose:parseAmountLoose,impAnalyze:impAnalyze,guessCols:guessCols,guessMode:guessMode,detectDateFmt:detectDateFmt,colorOf:colorOf,api:api,S:S,allocate:allocate,parseMoney:parseMoney,parsePct:parsePct,fmt:fmt,balances:balances,buildBackup:buildBackup,validateBackup:validateBackup,restoreBackup:restoreBackup,integrity:integrity,eraseAll:eraseAll,buildCsv:buildCsv,ui:ui,render:render,expFiltered:expFiltered,expSummaryHtml:expSummaryHtml,computeBalances:computeBalances,ready:null,H:H,activeBpTotal:activeBpTotal};
window.__budget.ready=init();
})();
